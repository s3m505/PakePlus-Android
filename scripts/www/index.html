<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原神抽卡期望计算器</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1f2430;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e8eaf0;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #2a3040;
    border-radius: 14px;
    padding: 26px 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  h1 {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 6px;
    text-align: center;
  }
  .sub {
    text-align: center;
    font-size: 12px;
    color: #8b93a7;
    margin-bottom: 22px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #a8b0c2;
    margin-bottom: 8px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    border-radius: 9px;
    border: 1px solid #3d465c;
    background: #1f2430;
    color: #e8eaf0;
    outline: none;
  }
  input:focus { border-color: #6c8cff; }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 9px;
    background: #6c8cff;
    color: #fff;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: #5a79e8; }
  button:active { background: #4d69d0; }
  .results {
    margin-top: 20px;
    border-top: 1px solid #3a4256;
    padding-top: 16px;
    display: none;
  }
  .results.show { display: block; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 9px 0;
  }
  .row + .row { border-top: 1px dashed #383f52; }
  .row .k { font-size: 13px; color: #a8b0c2; }
  .row .v { font-size: 19px; font-weight: 700; color: #7ee0a8; }
  .row .v.blue { color: #7fb6ff; }
  .row .v.gold { color: #f5c451; }
  .note {
    margin-top: 16px;
    font-size: 11px;
    line-height: 1.7;
    color: #79819a;
    border-top: 1px solid #3a4256;
    padding-top: 12px;
  }
</style>
</head>
<body>
<div class="card">
  <h1>原神抽卡期望计算器</h1>
  <div class="sub">粉蓝各换满长期口径（p = 0.5）</div>

  <label for="primo">原石数量</label>
  <input id="primo" type="number" min="0" step="1" placeholder="例如 7600">

  <button id="calcBtn">计算</button>

  <div class="results" id="results">
    <div class="row">
      <span class="k">粉球抽数 T</span>
      <span class="v blue" id="outT">—</span>
    </div>
    <div class="row">
      <span class="k">五星总数期望</span>
      <span class="v gold" id="outE5">—</span>
    </div>
    <div class="row">
      <span class="k">UP 角色期望（小保底）</span>
      <span class="v" id="outUp">—</span>
    </div>
  </div>

  <div class="note">
    公式：T = R ÷ 132.896，五星 = T ÷ 62.29，UP 小保底 = T ÷ 90.32。<br>
    星尘中换蓝球的部分已剔除，不计入抽数。结果取两位小数为期望值，实际抽卡有正常波动。
  </div>
</div>

<script>
  const DENOM = 132.896;   // 146.56 - 27.328 × 0.5
  const E5_DIV = 62.29;
  const UP_DIV = 90.32;

  const input = document.getElementById('primo');
  const results = document.getElementById('results');
  const outT = document.getElementById('outT');
  const outE5 = document.getElementById('outE5');
  const outUp = document.getElementById('outUp');

  function calc() {
    const r = parseFloat(input.value);

    if (!isFinite(r) || r < 0) {
      results.classList.remove('show');
      alert('请输入一个有效的原石数量（≥0）');
      return;
    }

    const T = r / DENOM;
    const e5 = T / E5_DIV;
    const eUp = T / UP_DIV;

    outT.textContent = T.toFixed(2) + ' 抽';
    outE5.textContent = e5.toFixed(2) + ' 个';
    outUp.textContent = eUp.toFixed(2) + ' 个';

    results.classList.add('show');
  }

  document.getElementById('calcBtn').addEventListener('click', calc);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') calc();
  });
</script>
</body>
</html>
